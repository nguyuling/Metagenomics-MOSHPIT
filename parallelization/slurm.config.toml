[parsl]

[[parsl.executors]]
class = "HighThroughputExecutor"
label = "default"

[parsl.executors.provider]
class = "SlurmProvider"
scheduler_options = "#SBATCH --mem-per-cpu=16G"
worker_init = "source ~/.bashrc && conda activate rachis-moshpit-2026.7"
walltime = "12:00:00"
nodes_per_block = 1
cores_per_node = 8
max_blocks = 14
exclusive = false